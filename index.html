<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Virtual Piano</title>

  <style>
    :root{
      --bg1:#0f1116;
      --bg2:#141824;
      --accent:#2fe7df;
      --card:#ffffff;
      --shadow: 0 18px 40px rgba(0,0,0,.35);
      --radius: 18px;
      --keyH: 300px;      /* 白鍵の高さ */
      --blackW: 64px;     /* 黒鍵の幅 */
      --blackH: 190px;    /* 黒鍵の高さ */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      color:#e9edf5;
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(47,231,223,.12), transparent 60%),
        radial-gradient(900px 700px at 80% 20%, rgba(255,255,255,.08), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .stage{
      width:min(1100px, 100%);
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:14px;
    }

    .title{
      font-size: clamp(40px, 6vw, 74px);
      font-weight: 800;
      letter-spacing: .02em;
      color: var(--accent);
      margin:0;
      line-height: 1.05;
      text-shadow: 0 10px 30px rgba(0,0,0,.35);
      white-space: nowrap;
    }

    .badge{
      display:flex;
      align-items:center;
      gap:10px;
      user-select:none;
      white-space: nowrap;
    }
    .ppt{
      width:46px;
      height:46px;
      border-radius: 12px;
      display:grid;
      place-items:center;
      background: radial-gradient(circle at 35% 30%, #ff8566, #d84a2e 70%);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      font-weight: 900;
      color:#fff;
      font-size: 22px;
    }
    .badgeText{
      font-size: clamp(22px, 3vw, 40px);
      font-weight: 900;
      color:#ffcf4a;
      text-shadow: 0 10px 24px rgba(0,0,0,.35);
      letter-spacing: .02em;
    }

    .card{
      background: rgba(255,255,255,.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 22px 18px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.35);
      backdrop-filter: blur(8px);
    }

    .hint{
      margin: 0 0 14px;
      color:#1d2330;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .hint small{
      font-weight:800;
      color:#2c3446;
      opacity:.95;
    }

    .btn{
      border:0;
      padding: 10px 14px;
      border-radius: 999px;
      cursor:pointer;
      font-weight: 900;
      background: #101522;
      color: #fff;
      box-shadow: 0 10px 22px rgba(0,0,0,.22);
      white-space: nowrap;
    }
    .btn:active{ transform: translateY(1px); }

    .pianoWrap{
      width: 100%;
      display:flex;
      justify-content:center;
    }

    /* 鍵盤（白鍵7つ） */
    .piano{
      position:relative; /* ←黒鍵の重なりのため重要 */
      width: min(900px, 100%);
      height: var(--keyH);
      border-radius: 16px;
      display:flex;
      gap: 0;
      padding: 0;
      background: #d7dde8;
      overflow:hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }

    .white{
      flex:1 1 0;
      position:relative;
      z-index: 1;
      background: linear-gradient(#f3f5f8, #e7ebf2);
      border-right: 1px solid rgba(0,0,0,.12);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding-bottom: 16px;
      user-select:none;
      cursor:pointer;
      touch-action: manipulation;
    }
    .white:last-child{ border-right:0; }

    .white .label{
      font-size: 34px;
      font-weight: 900;
      color:#101522;
    }

    .white.isDown{
      background: linear-gradient(#f8fbff, #e8edf6);
      box-shadow: inset 0 10px 18px rgba(0,0,0,.10);
      transform: translateY(1px);
    }

    /* 黒鍵 */
    .blackRow{
      position:absolute;
      left:0; top:0;
      width:100%;
      height: var(--blackH);
      z-index: 10;         /* ←前面に出す */
      pointer-events:none; /* ←黒鍵だけ個別に有効化する */
    }

    .black{
      pointer-events:auto;
      position:absolute;
      top:0;
      width: calc(100% / 7 * 0.52);
      max-width: var(--blackW);
      height: var(--blackH);
      background: linear-gradient(#3a3f4a, #0a0c10);
      border-radius: 0 0 10px 10px;
      box-shadow: 0 12px 18px rgba(0,0,0,.35);
      cursor:pointer;
      touch-action: manipulation;
      user-select:none;
      z-index: 11;
    }

    .black.isDown{
      background: linear-gradient(#4a5160, #0b0e14);
      transform: translateY(1px);
      box-shadow: 0 10px 16px rgba(0,0,0,.32);
    }

    /* 黒鍵の配置（7白鍵に対して：C#, D#, なし, F#, G#, A#, なし） */
    .b1{ left: calc(100% / 7 * 0.72); }
    .b2{ left: calc(100% / 7 * 1.72); }
    .b4{ left: calc(100% / 7 * 3.72); }
    .b5{ left: calc(100% / 7 * 4.72); }
    .b6{ left: calc(100% / 7 * 5.72); }

    /* いま鳴った音（大表示） */
    .nowNote{
      margin-left:auto;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(16,21,34,.08);
      color:#101522;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: .02em;
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 320px;
      justify-content:center;
      text-align:center;
    }
    .nowNote .sub{
      font-size: 14px;
      font-weight: 900;
      opacity: .82;
    }

    .foot{
      margin-top: 10px;
      color: rgba(233,237,245,.85);
      font-weight: 700;
      display:flex;
      justify-content:flex-end;
      font-size: 14px;
      letter-spacing:.02em;
    }

    @media (max-width: 720px){
      :root{ --keyH: 240px; --blackH: 150px; }
      .white .label{ font-size: 26px; }
      .nowNote{ font-size: 18px; min-width: 220px; }
    }

    /* 音有効化のオーバーレイ */
    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 9999;
    }
    .overlayCard{
      width:min(520px, 100%);
      background: rgba(255,255,255,.95);
      color:#111827;
      border-radius: 18px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.35);
    }
    .overlayCard h3{ margin: 0 0 8px; font-size: 18px; }
    .overlayCard p{ margin: 0 0 12px; font-weight: 800; color:#2b3344; }
    .overlayCard .btn{ width:100%; padding: 12px 14px; font-size: 16px; }
    .hide{ display:none !important; }
    .btnSub{
  background: rgba(16,21,34,.18);
  color:#101522;
  box-shadow: none;
  border: 1px solid rgba(16,21,34,.18);
}
.btnSub:active{ transform: translateY(1px); }

  </style>
</head>

<body>
  <div class="stage">
    <div class="topbar">
      <h1 class="title">Virtual Piano</h1>
      <div class="badge" aria-label="PowerPoint badge (decorative)">
        <div class="ppt">P</div>
        <div class="badgeText">PowerPoint</div>
      </div>
    </div>

    <div class="card">
      <div class="hint">
        <span>鍵盤をクリック/タップすると鳴ります。</span>
        <small id="info">準備中…</small>
        <button class="btn" id="reEnable" type="button">🔊 音を有効化</button>
        <button class="btn btnSub" id="resetBtn" type="button">↩ リセット</button>
        <div id="nowNote" class="nowNote">♪ まだ鳴っていません <span class="sub">（回数：0）</span></div>
      </div>

      <div class="pianoWrap">
        <div class="piano" role="application" aria-label="バーチャルピアノ">
          <!-- 黒鍵 -->
          <div class="blackRow">
            <div class="black b1" data-note="C#4" title="C#"></div>
            <div class="black b2" data-note="D#4" title="D#"></div>
            <div class="black b4" data-note="F#4" title="F#"></div>
            <div class="black b5" data-note="G#4" title="G#"></div>
            <div class="black b6" data-note="A#4" title="A#"></div>
          </div>

          <!-- 白鍵（ドレミ） -->
          <div class="white" data-note="C4"><div class="label">ド</div></div>
          <div class="white" data-note="D4"><div class="label">レ</div></div>
          <div class="white" data-note="E4"><div class="label">ミ</div></div>
          <div class="white" data-note="F4"><div class="label">ファ</div></div>
          <div class="white" data-note="G4"><div class="label">ソ</div></div>
          <div class="white" data-note="A4"><div class="label">ラ</div></div>
          <div class="white" data-note="B4"><div class="label">シ</div></div>
        </div>
      </div>
    </div>

    <div class="foot">（URL配布OK：ブラウザで動きます）</div>
  </div>

  <!-- iPad/スマホ向け：最初の1タップで音を有効化 -->
  <div class="overlay" id="overlay">
    <div class="overlayCard">
      <h3>🔊 音を有効化してください</h3>
      <p>iPadやスマホでは、最初に1回タップしないと音が鳴りません。</p>
      <button class="btn" id="enableBtn" type="button">音を有効化して開始</button>
    </div>
  </div>

  <script>
    // ===== Audio =====
    let ctx = null;
    let playCount = 0;

    const freq = {
      "C4": 261.63, "C#4": 277.18,
      "D4": 293.66, "D#4": 311.13,
      "E4": 329.63,
      "F4": 349.23, "F#4": 369.99,
      "G4": 392.00, "G#4": 415.30,
      "A4": 440.00, "A#4": 466.16,
      "B4": 493.88
    };

    const noteLabelJP = {
      "C4":"ド","C#4":"ド#",
      "D4":"レ","D#4":"レ#",
      "E4":"ミ",
      "F4":"ファ","F#4":"ファ#",
      "G4":"ソ","G#4":"ソ#",
      "A4":"ラ","A#4":"ラ#",
      "B4":"シ"
    };

    function ensureCtx(){
      if(!ctx){
        ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return ctx;
    }

    async function enableAudio(){
      const ac = ensureCtx();
      if(ac.state === "suspended") await ac.resume();
      document.getElementById("info").textContent = "✅ 音OK（鍵盤を押してください）";
      document.getElementById("overlay").classList.add("hide");
    }

    function updateNowNote(note){
      playCount++;
      const label = noteLabelJP[note] || note;
      document.getElementById("nowNote").innerHTML =
        `♪ 今の音：<span style="font-size:1.2em">${label}</span> <span class="sub">（回数：${playCount}）</span>`;
    }

    function playTone(note, ms=220){
      const ac = ensureCtx();
      if(ac.state !== "running"){
        document.getElementById("info").textContent = "⚠ 先に「音を有効化」を押してください";
        return;
      }

      const f = freq[note];
      if(!f) return;

      updateNowNote(note);

      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();

      // ちょっとピアノっぽい（簡易）
      osc.type = "triangle";
      osc.frequency.setValueAtTime(f, now);

      // クリック音防止 + 余韻
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + ms/1000 + 0.12);

      osc.connect(gain);
      gain.connect(ac.destination);

      osc.start(now);
      osc.stop(now + ms/1000 + 0.15);
    }

    // ===== UI press effect =====
    function press(el, on){
      if(!el) return;
      el.classList.toggle("isDown", on);
    }

    function bindKey(el){
      const note = el.dataset.note;

      const down = (e)=>{
        e.preventDefault();
        press(el, true);
        playTone(note);
      };
      const up = (e)=>{
        e.preventDefault();
        press(el, false);
      };

      // mouse
      el.addEventListener("mousedown", down);
      window.addEventListener("mouseup", up);

      // touch
      el.addEventListener("touchstart", down, {passive:false});
      el.addEventListener("touchend", up, {passive:false});
      el.addEventListener("touchcancel", up, {passive:false});

      // keyboard
      el.setAttribute("tabindex","0");
      el.addEventListener("keydown", (e)=>{
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          press(el, true);
          playTone(note);
          setTimeout(()=>press(el,false), 120);
        }
      });
    }

    document.querySelectorAll(".white, .black").forEach(bindKey);

    // Enable buttons
    document.getElementById("enableBtn").addEventListener("click", enableAudio);
    document.getElementById("reEnable").addEventListener("click", enableAudio);

    // Status
    document.getElementById("info").textContent = "⚠ まず「音を有効化」を押してください";
    document.getElementById("resetBtn").addEventListener("click", ()=>{
  playCount = 0;
  document.getElementById("nowNote").innerHTML =
    `♪ まだ鳴っていません <span class="sub">（回数：0）</span>`;
});

  </script>
</body>
</html>
